plugins {
    id 'com.android.application'
}

android {
    // The launcher's classes keep their upstream package (cleanyourtv's launcher/, com.gathin.tvhome), so its
    // files stay as upstream wrote them and later fixes copy in cleanly. Tatami's own classes are in
    // io.github.pbanddev.tatamihome. The installed app is applicationId below, not this.
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.pbanddev.tatamihome'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: signed with the local debug key, so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies; this app is plain Java and never reads it.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    testImplementation 'junit:junit:4.13.2'
}
